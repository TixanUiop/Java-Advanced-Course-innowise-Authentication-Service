spring:
  application:
    name: authentication-service
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myappdb}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:com-innowise-authentication-service-secret-key}